<div fxLayout="row" fxLayouAling>
  <div fxLayout="column" fxFlex="900px">
    <form class="mt-60" #clientesFrm="ngForm" (ngSubmit)="salvar()">
      <mat-card>
        <mat-card-header>
          <mat-card-title> Dados Pessoais </mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-20">
          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="700px">
              <mat-form-field class="full-width">
                <mat-label>Nome: *</mat-label>
                <input type="text" [(ngModel)]="cliente.nome" name="nome" placeholder="Ex: Rafael Santos" matInput />
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="700px">
              <mat-form-field class="full-width">
                <mat-label>Email: *</mat-label>
                <input type="text" [(ngModel)]="cliente.email" name="email" placeholder="Digite seu email" matInput>
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>CPF: *</mat-label>
                <input type="text" [(ngModel)]="cliente.cpf" name="cpf" mask="000.000.000-00"
                  placeholder="Digite seu CPF" matInput>
              </mat-form-field>
            </div>
          </div>


          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>Data Nascimento: *</mat-label>
                <input type="text" [(ngModel)]="cliente.dataNascimento" name="dataNascimento" mask="00/00/0000"
                  placeholder="Digite sua data de Nascimento" matInput>
              </mat-form-field>
            </div>
          </div>

          <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
            <div fxLayout="column" fxFlex="400px">
              <mat-form-field class="full-width">
                <mat-label>CEP *</mat-label>
                <input type="text" [(ngModel)]="cliente.cep" name="dataNascimento" mask="00000-000"
                  placeholder="Digite seu CEP" matInput>
              </mat-form-field>
            </div>
          </div>




        </mat-card-content>

        <mat-card-actions>
          @if(!atualizando){
          <button mat-flat-button color="primary" type="submit" class="ml-5">
            <mat-icon fontIcon="save"></mat-icon>
            Salvar
          </button>

          }@else {
          <button mat-flat-button color="primary" class="ml-5">
            <mat-icon fontIcon="refresh"></mat-icon>
            Atualizar
          </button>
          }

          <button mat-flat-button color="accent" class="ml-5">
            <mat-icon fontIcon="backspace"></mat-icon>
            Limpar
          </button>
        </mat-card-actions>
      </mat-card>

    </form>


  </div>





</div>
